<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" style="background-color: #0A0A0B; font-family: 'Plus Jakarta Sans', Outfit, sans-serif;">
  <defs>
    <!-- Glow effect for trusted zone -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .bg { fill: #0A0A0B; }
      .surface { fill: #131316; stroke: #26262C; stroke-width: 2; rx: 8; }
      .zone-attackable { fill: rgba(228, 0, 43, 0.05); stroke: #E4002B; stroke-dasharray: 6 6; stroke-width: 2; rx: 12; }
      .zone-trusted { fill: rgba(122, 12, 26, 0.1); stroke: #F5F5F6; stroke-width: 2; rx: 12; filter: url(#crimsonGlow); }
      .zone-verifier { fill: rgba(154, 154, 160, 0.05); stroke: #9A9AA0; stroke-width: 2; rx: 12; }
      
      .text-title { fill: #F5F5F6; font-size: 18px; font-weight: 700; }
      .text-sub { fill: #9A9AA0; font-size: 12px; font-weight: 300; }
      
      .arrow { stroke: #E4002B; stroke-width: 2; fill: none; }
      .arrow-head { fill: #E4002B; }
      
      .swatch-band { rx: 2; }
      .sb-1 { fill: #F5F5F6; }
      .sb-2 { fill: #E2E2E5; }
      .sb-3 { fill: #9A9AA0; }
      .sb-4 { fill: #E4002B; }
      .sb-5 { fill: #7A0C1A; }
      .sb-6 { fill: #0A0A0B; }
    </style>
  </defs>

  <rect width="1400" height="800" class="bg" />

  <!-- Zones -->
  <rect x="50" y="50" width="700" height="700" class="zone-attackable" />
  <text x="70" y="80" class="text-sub" fill="#E4002B">ASSUMED ATTACKABLE</text>

  <rect x="800" y="50" width="250" height="300" class="zone-trusted" />
  <text x="820" y="80" class="text-sub" fill="#F5F5F6">TRUSTED</text>

  <rect x="800" y="400" width="550" height="350" class="zone-verifier" />
  <text x="820" y="430" class="text-sub" fill="#9A9AA0">VERIFIER SIDE</text>
  
  <rect x="1100" y="150" width="250" height="150" class="surface" />
  <text x="1120" y="170" class="text-sub" fill="#9A9AA0">EXTERNAL</text>

  <!-- Components -->
  <!-- 1. Client -->
  <g transform="translate(100, 150)">
    <rect width="180" height="80" class="surface" />
    <text x="20" y="35" class="text-title">Client / Agent SDK</text>
    <text x="20" y="55" class="text-sub">signs every request</text>
  </g>

  <!-- 2. Gateway -->
  <g transform="translate(350, 100)">
    <rect width="350" height="400" class="surface" />
    <text x="20" y="35" class="text-title">GATEWAY</text>
    <text x="20" y="55" class="text-sub">the guard and the chaperone</text>
    
    <rect x="20" y="80" width="310" height="60" fill="#1A1A1E" rx="4" />
    <text x="30" y="100" class="text-sub" fill="#F5F5F6">Pipeline:</text>
    <text x="30" y="120" class="text-sub">Sanity → Sig → Rate → Rules → Honey → Policy</text>
    
    <rect x="20" y="150" width="150" height="100" fill="#1A1A1E" rx="4" />
    <text x="30" y="170" class="text-title" font-size="14px">Web Lane</text>
    <text x="30" y="200" class="text-sub">Header signing</text>
    <text x="30" y="220" class="text-sub">Origin lock</text>

    <rect x="180" y="150" width="150" height="100" fill="#1A1A1E" rx="4" />
    <text x="190" y="170" class="text-title" font-size="14px">Agent Lane</text>
    <text x="190" y="200" class="text-sub">Cred Broker</text>
    <text x="190" y="220" class="text-sub">Approval Hold</text>

    <text x="30" y="290" class="text-sub">Logger (Intent/Outcome)</text>
    <text x="30" y="320" class="text-sub">Responder (Tiers 1-4)</text>
    <text x="30" y="350" class="text-sub">Heartbeat Emitter</text>
  </g>

  <!-- Redis -->
  <g transform="translate(200, 260)">
    <rect width="100" height="50" class="surface" />
    <text x="10" y="30" class="text-title" font-size="14px">Redis</text>
  </g>

  <!-- 3. Origin App -->
  <g transform="translate(100, 400)">
    <rect width="180" height="80" class="surface" />
    <text x="20" y="35" class="text-title">ORIGIN APP</text>
    <text x="20" y="55" class="text-sub">demo shop</text>
    <!-- Wall/Lock icon -->
    <rect x="150" y="10" width="20" height="20" fill="#E4002B" />
  </g>

  <!-- 5. Ledger -->
  <g transform="translate(150, 550)">
    <rect width="450" height="120" class="surface" />
    <text x="20" y="35" class="text-title">LEDGER</text>
    <text x="20" y="55" class="text-sub">the diary</text>
    <text x="20" y="80" class="text-sub">PostgreSQL append-only | Merkle tree | Checkpoints</text>
  </g>

  <!-- 4. Payment Provider -->
  <g transform="translate(1120, 200)">
    <text x="20" y="35" class="text-title">PROVIDER</text>
    <text x="20" y="55" class="text-sub">mock payment</text>
  </g>

  <!-- 6. Witness -->
  <g transform="translate(830, 230)">
    <rect width="180" height="80" class="surface" />
    <text x="20" y="35" class="text-title">WITNESS</text>
    <text x="20" y="55" class="text-sub">the notary</text>
  </g>

  <!-- 13. Offline Root Key -->
  <g transform="translate(830, 100)">
    <rect width="180" height="80" class="surface" />
    <text x="20" y="35" class="text-title">Offline Root Key</text>
    <text x="20" y="55" class="text-sub">+ 3-of-5 holders</text>
  </g>

  <!-- 12. Human Approver -->
  <g transform="translate(1150, 100)">
    <text x="0" y="30" class="text-title" fill="#F5F5F6">Human Approver</text>
  </g>

  <!-- Verifier Side Components -->
  <g transform="translate(830, 450)">
    <rect width="160" height="60" class="surface" />
    <text x="15" y="25" class="text-title" font-size="14px">VERIFIER</text>
    <text x="15" y="45" class="text-sub">offline CLI</text>
  </g>
  
  <g transform="translate(1020, 450)">
    <rect width="160" height="60" class="surface" />
    <text x="15" y="25" class="text-title" font-size="14px">RECONCILER</text>
    <text x="15" y="45" class="text-sub">bank statement check</text>
  </g>

  <g transform="translate(830, 550)">
    <rect width="160" height="60" class="surface" />
    <text x="15" y="25" class="text-title" font-size="14px">RECOVERY</text>
    <text x="15" y="45" class="text-sub">toolkit</text>
  </g>

  <g transform="translate(1020, 550)">
    <rect width="160" height="60" class="surface" />
    <text x="15" y="25" class="text-title" font-size="14px">AI NARRATOR</text>
    <text x="15" y="45" class="text-sub">summary, not evidence</text>
  </g>

  <g transform="translate(930, 650)">
    <rect width="160" height="60" class="surface" />
    <text x="15" y="25" class="text-title" font-size="14px">DASHBOARD</text>
  </g>

  <!-- Swatches (mini) -->
  <g transform="translate(100, 150)">
    <rect x="155" y="10" width="5" height="15" class="swatch-band sb-1" />
    <rect x="160" y="10" width="5" height="15" class="swatch-band sb-4" />
    <rect x="165" y="10" width="5" height="15" class="swatch-band sb-5" />
  </g>

  <!-- Arrows -->
  <path d="M 280 190 L 340 190" class="arrow" />
  <polygon points="340,185 350,190 340,195" class="arrow-head" />

  <path d="M 350 440 L 290 440" class="arrow" />
  <polygon points="290,435 280,440 290,445" class="arrow-head" />

  <path d="M 525 500 L 525 540" class="arrow" />
  <polygon points="520,540 525,550 530,540" class="arrow-head" />

  <path d="M 700 270 L 820 270" class="arrow" />
  <polygon points="820,265 830,270 820,275" class="arrow-head" />

  <path d="M 600 610 L 800 610 L 800 310 L 840 310" class="arrow" />
  <polygon points="840,305 850,310 840,315" class="arrow-head" />

</svg>
