# TODO(spec §13.5): parser/evaluation are stubs; these are illustrative dev values.
version: dev-scaffold-1
currency_unit: minor
risk_classes:
  read_invoice: low
  refund: high
  charge: high
tool_allow_list: [read_invoice, refund, charge]
rules:
  - id: block-destructive
    operations: [delete_account, delete_all_records]
    decision: block
    severity: high
  - id: approve-large-refund
    tool: refund
    amount_above_minor: 10000
    decision: require_approval
    severity: high
  - id: permit-listed-tools
    tools: [read_invoice, refund, charge]
    decision: allow
    severity: low
# Rule precedence and field grammar must be settled before implementing the engine.
